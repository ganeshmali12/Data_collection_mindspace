{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}MindSpace Data Collection{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  {% block extra_css %}{% endblock %}
  {% block styles %}{% endblock %}
</head>
<body class="min-h-screen bg-[#FAF7F2] text-[#1E293B]" style="background: radial-gradient(circle at 50% 0%, #F5EFEB 0%, #FAF7F2 70%) fixed; color: #1E293B;">
  {% block content %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
