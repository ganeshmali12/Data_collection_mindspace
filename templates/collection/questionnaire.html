<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MindSpace — Participant Questionnaire</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Fraunces:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #FAF7F2;
    --bg-card: #FFFFFF;
    --bg-card-hover: #F5EFEB;
    --border: #E2D9CE;
    --border-active: rgba(79, 70, 229, 0.6);
    --text-primary: #1E293B;
    --text-secondary: #475569;
    --text-muted: #64748B;
    --accent: #4F46E5;
    --accent-soft: rgba(79, 70, 229, 0.08);
    --accent-border: rgba(79, 70, 229, 0.35);
    --section-phq: #D94848;
    --section-phq-soft: rgba(217, 72, 72, 0.1);
    --section-gad: #D97706;
    --section-gad-soft: rgba(217, 119, 6, 0.1);
    --section-pss: #059669;
    --section-pss-soft: rgba(5, 150, 105, 0.1);
    --section-mdq: #7C3AED;
    --section-mdq-soft: rgba(124, 58, 237, 0.1);
    --section-cssrs: #E11D48;
    --section-cssrs-soft: rgba(225, 29, 72, 0.1);
    --radius: 14px;
    --radius-sm: 8px;
    --radius-pill: 100px;
    --transition: 0.2s cubic-bezier(0.4,0,0.2,1);
    --shadow-card: 0 4px 20px -2px rgba(80, 65, 50, 0.06), 0 1px 3px rgba(80, 65, 50, 0.04);
  }

  body {
    font-family: 'Inter', 'Noto Sans Devanagari', sans-serif;
    background: radial-gradient(circle at 50% 0%, #F5EFEB 0%, #FAF7F2 70%) fixed;
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
    -webkit-font-smoothing: antialiased;
  }

  .shell {
    width: 100%;
    max-width: 640px;
  }

  /* ── Header ── */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.5rem;
    gap: 12px;
    flex-wrap: wrap;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .logo-mark {
    width: 34px; height: 34px;
    border-radius: 10px;
    background: linear-gradient(135deg, #6b8eff 0%, #cc5de8 100%);
    display: flex; align-items: center; justify-content: center;
  }
  .logo-mark svg { width: 18px; height: 18px; }
  .logo-name {
    font-family: 'Fraunces', serif;
    font-weight: 300;
    font-size: 18px;
    color: var(--text-primary);
    letter-spacing: -0.3px;
  }

  /* ── Language Selector ── */
  .lang-switcher {
    display: inline-flex;
    align-items: center;
    background: #EDE6DC;
    border: 1px solid var(--border);
    border-radius: var(--radius-pill);
    padding: 3px;
    gap: 2px;
  }
  .lang-btn {
    background: transparent;
    border: none;
    color: var(--text-secondary);
    font-family: 'Inter', 'Noto Sans Devanagari', sans-serif;
    font-size: 12px;
    font-weight: 500;
    padding: 5px 11px;
    border-radius: var(--radius-pill);
    cursor: pointer;
    transition: all 0.18s cubic-bezier(0.4, 0, 0.2, 1);
    line-height: 1.2;
  }
  .lang-btn:hover {
    color: var(--text-primary);
    background: rgba(255, 255, 255, 0.7);
  }
  .lang-btn.active {
    background: var(--accent);
    color: #ffffff;
    font-weight: 600;
    box-shadow: 0 2px 6px rgba(79, 70, 229, 0.3);
  }

  /* ── Progress ── */
  .progress-wrap { margin-bottom: 1.75rem; }
  .progress-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .progress-section-name {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    font-family: 'Inter', 'Noto Sans Devanagari', sans-serif;
  }
  .progress-pct {
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 600;
  }
  .progress-track {
    height: 4px;
    background: #E8E0D5;
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 0.4s cubic-bezier(0.4,0,0.2,1), background 0.4s;
  }

  /* ── Question card ── */
  .q-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.75rem;
    margin-bottom: 1.25rem;
    box-shadow: var(--shadow-card);
    will-change: transform, opacity;
  }

  .slide-in-right {
    animation: slideInRight 0.28s cubic-bezier(0.2, 0.8, 0.25, 1) forwards;
  }
  .slide-in-left {
    animation: slideInLeft 0.28s cubic-bezier(0.2, 0.8, 0.25, 1) forwards;
  }
  .slide-out-left {
    animation: slideOutLeft 0.2s cubic-bezier(0.4, 0, 0.6, 1) forwards;
  }
  .slide-out-right {
    animation: slideOutRight 0.2s cubic-bezier(0.4, 0, 0.6, 1) forwards;
  }

  @keyframes slideInRight {
    from { opacity: 0; transform: translateX(28px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  @keyframes slideInLeft {
    from { opacity: 0; transform: translateX(-28px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  @keyframes slideOutLeft {
    from { opacity: 1; transform: translateX(0); }
    to   { opacity: 0; transform: translateX(-28px); }
  }
  @keyframes slideOutRight {
    from { opacity: 1; transform: translateX(0); }
    to   { opacity: 0; transform: translateX(28px); }
  }

  .section-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 3px 9px;
    border-radius: var(--radius-pill);
    font-size: 11px;
    font-weight: 600;
    margin-bottom: 0.9rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-family: 'Inter', 'Noto Sans Devanagari', sans-serif;
  }

  .instruction-text {
    font-size: 13.5px;
    color: var(--text-muted);
    margin-bottom: 1.25rem;
    line-height: 1.6;
    font-family: 'Inter', 'Noto Sans Devanagari', sans-serif;
  }

  .q-text {
    font-family: 'Fraunces', 'Noto Sans Devanagari', serif;
    font-size: 19px;
    font-weight: 400;
    line-height: 1.55;
    color: var(--text-primary);
    margin-bottom: 1.75rem;
    letter-spacing: -0.1px;
  }

  /* ── Options ── */
  .options-freq {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .options-choice {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .options-freq-5 {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
  }
  .options-yesno {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    max-width: 320px;
  }

  .opt-choice {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 14px 10px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: #FFFFFF;
    color: var(--text-secondary);
    font-family: 'Inter', 'Noto Sans Devanagari', sans-serif;
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.18s cubic-bezier(0.4,0,0.2,1);
    text-align: center;
    line-height: 1.35;
    min-height: 54px;
    user-select: none;
    box-shadow: 0 1px 2px rgba(80, 65, 50, 0.04);
  }
  .opt-choice:hover {
    border-color: var(--accent);
    background: #F8F5F0;
    color: var(--text-primary);
    transform: translateY(-2px);
  }
  .opt-choice:active {
    transform: scale(0.96);
  }
  .opt-choice.selected {
    border-color: var(--accent);
    background: #EEF2FF;
    color: #1E1B4B;
    font-weight: 600;
    box-shadow: 0 0 0 1px var(--accent), 0 2px 8px rgba(79, 70, 229, 0.18);
    transform: scale(1.02);
  }

  .opt {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 12px 8px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: #FFFFFF;
    color: var(--text-secondary);
    font-family: 'Inter', 'Noto Sans Devanagari', sans-serif;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.18s cubic-bezier(0.4,0,0.2,1);
    text-align: center;
    line-height: 1.35;
    min-height: 72px;
    user-select: none;
    box-shadow: 0 1px 2px rgba(80, 65, 50, 0.04);
  }
  .opt:hover {
    border-color: var(--accent);
    background: #F8F5F0;
    color: var(--text-primary);
    transform: translateY(-2px);
  }
  .opt:active {
    transform: scale(0.96);
  }
  .opt.selected {
    border-color: var(--accent);
    background: #EEF2FF;
    color: #1E1B4B;
    font-weight: 600;
    box-shadow: 0 0 0 1px var(--accent), 0 2px 8px rgba(79, 70, 229, 0.18);
    transform: scale(1.02);
  }
  .opt .opt-num {
    font-size: 16px;
    font-weight: 700;
    font-family: 'Fraunces', serif;
    color: var(--accent);
    line-height: 1;
  }

  .opt-yn {
    padding: 14px 20px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: #FFFFFF;
    color: var(--text-secondary);
    font-family: 'Inter', 'Noto Sans Devanagari', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.18s cubic-bezier(0.4,0,0.2,1);
    text-align: center;
    min-height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    box-shadow: 0 1px 2px rgba(80, 65, 50, 0.04);
  }
  .opt-yn:hover {
    border-color: var(--border-active);
    background: #F8F5F0;
    color: var(--text-primary);
    transform: translateY(-2px);
  }
  .opt-yn:active {
    transform: scale(0.96);
  }
  .opt-yn.selected {
    border-color: var(--accent);
    background: #EEF2FF;
    color: #1E1B4B;
    font-weight: 600;
    box-shadow: 0 0 0 1px var(--accent), 0 2px 8px rgba(79, 70, 229, 0.18);
    transform: scale(1.02);
  }
  .opt-yn.selected-yes {
    border-color: var(--section-cssrs);
    background: #FFF1F2;
    color: #9F1239;
    font-weight: 600;
    box-shadow: 0 0 0 1px var(--section-cssrs), 0 2px 8px rgba(225, 29, 72, 0.18);
    transform: scale(1.02);
  }

  .options-disabled {
    pointer-events: none;
  }

  /* ── Error ── */
  .err-msg {
    font-size: 12px;
    color: var(--section-phq);
    margin-bottom: 1rem;
    display: none;
    animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }

  /* ── Nav ── */
  .nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  .btn-back {
    padding: 12px 20px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: #FFFFFF;
    color: var(--text-secondary);
    font-family: 'Inter', 'Noto Sans Devanagari', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: var(--transition);
    display: flex; align-items: center; gap: 6px;
    box-shadow: 0 1px 2px rgba(80, 65, 50, 0.04);
  }
  .btn-back:hover { border-color: var(--accent); color: var(--text-primary); background: #F8F5F0; }
  .btn-back:invisible { visibility: hidden; }

  .step-indicator {
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 600;
    letter-spacing: 0.3px;
    font-family: 'Inter', 'Noto Sans Devanagari', sans-serif;
  }

  button:focus-visible {
    outline: 3px solid rgba(79, 70, 229, 0.55);
    outline-offset: 2px;
  }

  /* ── Results ── */
  .result-hero {
    text-align: center;
    padding: 2.5rem 1.5rem 2rem;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 1.25rem;
    box-shadow: var(--shadow-card);
    animation: slideIn 0.35s cubic-bezier(0.4,0,0.2,1);
  }
  .result-hero-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--text-muted);
    margin-bottom: 0.75rem;
    font-weight: 600;
  }
  .result-primary-name {
    font-family: 'Fraunces', 'Noto Sans Devanagari', serif;
    font-size: 28px;
    font-weight: 400;
    color: var(--text-primary);
    letter-spacing: -0.5px;
    margin-bottom: 0.5rem;
  }

  .disclaimer {
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.7;
    text-align: center;
    padding: 1rem;
    border-top: 1px solid var(--border);
    margin-top: 1rem;
    font-family: 'Inter', 'Noto Sans Devanagari', sans-serif;
  }

  @media (max-width: 600px) {
    body {
      align-items: flex-start;
      padding: max(1rem, env(safe-area-inset-top))
        max(0.75rem, env(safe-area-inset-right))
        max(1.25rem, env(safe-area-inset-bottom))
        max(0.75rem, env(safe-area-inset-left));
    }

    .shell { max-width: 100%; }

    .header {
      margin-bottom: 1.25rem;
    }

    .progress-wrap { margin-bottom: 1.25rem; }

    .q-card {
      padding: 1.25rem;
      margin-bottom: 1rem;
    }

    .q-text {
      font-size: 17px;
      margin-bottom: 1.35rem;
    }

    .options-freq { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .options-choice { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .options-freq-5 { grid-template-columns: repeat(2, minmax(0, 1fr)); }

    .opt,
    .opt-yn,
    .opt-choice,
    .btn-back {
      min-height: 48px;
    }

    .opt {
      padding: 10px 6px;
    }

    .options-yesno {
      max-width: none;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .nav { padding-top: 0.25rem; }
    .btn-back { padding: 12px 16px; }

    .result-hero {
      padding: 2rem 1rem 1.5rem;
    }

    .result-primary-name { font-size: 24px; }
  }

  @media (max-width: 360px) {
    .logo-name { font-size: 16px; }
    .q-card { padding: 1rem; }
    .q-text { font-size: 16px; }
    .btn-back { padding-left: 12px; padding-right: 12px; }
  }
</style>
</head>

<div class="shell">

  <!-- Header -->
  <div class="header">
    <div class="logo">
      <div class="logo-mark">
        <svg viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="9" cy="9" r="3.5" fill="white" opacity="0.9"/>
          <circle cx="9" cy="9" r="7" stroke="white" stroke-width="1" stroke-opacity="0.4"/>
          <path d="M9 2v2M9 14v2M2 9h2M14 9h2" stroke="white" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.5"/>
        </svg>
      </div>
      <span class="logo-name">MindSpace</span>
    </div>

    <!-- Language Selector Pill -->
    <div style="display:flex;align-items:center;gap:12px;">
      <a href="{% url 'collection:activity_hub' %}" style="font-size:12px;color:var(--text-secondary);text-decoration:none;padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:#FFFFFF;box-shadow:0 1px 2px rgba(80,65,50,0.04);font-weight:500;">
        ← Activities Hub
      </a>
      <div class="lang-switcher" id="lang-switcher">
        <button type="button" class="lang-btn active" data-lang="en" onclick="setLanguage('en')">English</button>
        <button type="button" class="lang-btn" data-lang="hi" onclick="setLanguage('hi')">हिंदी</button>
        <button type="button" class="lang-btn" data-lang="mr" onclick="setLanguage('mr')">मराठी</button>
      </div>
    </div>
  </div>

  <!-- Progress -->
  <div class="progress-wrap">
    <div class="progress-meta">
      <span class="progress-section-name" id="section-name">Mood & Outlook</span>
      <span class="step-indicator" id="step-indicator">Question 1 of 30</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="prog-fill" style="width:3%;background:var(--accent)"></div>
    </div>
  </div>

  <!-- Main area -->
  <div id="main-area"></div>

  <!-- Error -->
  <div class="err-msg" id="err-msg"></div>

  <!-- Nav -->
  <div class="nav" id="nav-bar">
    <button class="btn-back" id="btn-back" onclick="prev()">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M8.5 2.5L4 7l4.5 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span id="btn-back-label">Back</span>
    </button>
  </div>

</div>

<script>
function getCookie(name) {
  const cookies = document.cookie ? document.cookie.split(';') : [];
  for (const cookie of cookies) {
    const [key, ...value] = cookie.trim().split('=');
    if (key === name) return decodeURIComponent(value.join('='));
  }
  return '';
}

let allQ = [];
SECTIONS.forEach((s, si) => {
  s.questions.forEach((q, qi) => allQ.push({ sec: si, qi, textObj: q, text: q.en }));
});

let answers = new Array(allQ.length).fill(null);
let cur = 0;
let isTransitioning = false;

function setLanguage(lang) {
  if (!UI_TEXT[lang]) return;
  currentLang = lang;
  localStorage.setItem('mindspace_questionnaire_lang', lang);

  // Update switcher buttons state
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
  });

  // Re-render current question with selected language
  render('none');
}

function getSectionScore(si) {
  const s = SECTIONS[si];
  const start = SECTIONS.slice(0,si).reduce((a,b)=>a+b.questions.length,0);
  let total = 0;
  s.questions.forEach((_,i) => {
    let v = answers[start+i];
    if (v === null) return;
    if (s.id === 'mdq7') {
      // 0 = Never, 1 = Rarely, 2 = Sometimes, 3 = Often
      // Scoring: Never/Rarely = 0, Sometimes/Often = 1
      total += (v >= 2 ? 1 : 0);
    } else if (s.reverse && s.reverse.includes(i)) {
      v = s.values[s.values.length-1] - v;
      total += v;
    } else {
      total += v;
    }
  });
  return total;
}

function render(direction = 'initial') {
  const q = allQ[cur];
  const s = SECTIONS[q.sec];
  const total = allQ.length;
  const pct = Math.max(3, Math.round(((cur + 1) / total) * 100));
  const ui = UI_TEXT[currentLang] || UI_TEXT.en;

  // Language buttons highlight
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.toggle('active', btn.getAttribute('data-lang') === currentLang);
  });

  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-fill').style.background = s.color || 'var(--accent)';
  
  const sectionLabel = (s.shortName && s.shortName[currentLang]) ? s.shortName[currentLang] : (s.shortName ? s.shortName.en : 'Questionnaire');
  document.getElementById('section-name').textContent = sectionLabel;
  document.getElementById('step-indicator').textContent = ui.questionCount(cur + 1, total);

  const backBtn = document.getElementById('btn-back');
  const backLabel = document.getElementById('btn-back-label');
  if (backBtn) {
    backBtn.style.visibility = cur > 0 ? 'visible' : 'hidden';
  }
  if (backLabel) {
    backLabel.textContent = ui.back;
  }

  const errMsg = document.getElementById('err-msg');
  if (errMsg) {
    errMsg.style.display = 'none';
    errMsg.textContent = ui.errMsg;
  }

  const activeScale = (s.scale && s.scale[currentLang]) ? s.scale[currentLang] : s.scale.en;
  const activeInstruction = (s.instruction && s.instruction[currentLang]) ? s.instruction[currentLang] : s.instruction.en;
  const activeQuestionText = (q.textObj && q.textObj[currentLang]) ? q.textObj[currentLang] : q.textObj.en;
  const fullSectionTitle = (s.name && s.name[currentLang]) ? s.name[currentLang] : s.name.en;

  let optionsHtml = '';
  if (s.type === 'freq') {
    optionsHtml = `<div class="options-freq">`;
    activeScale.forEach((label, i) => {
      const sel = answers[cur] === s.values[i] ? 'selected' : '';
      optionsHtml += `<button type="button" class="opt ${sel}" onclick="selectAnswer(${s.values[i]}, this)">
        <span class="opt-num">${s.values[i]}</span>
        <span>${label}</span>
      </button>`;
    });
    optionsHtml += `</div>`;
  } else if (s.type === 'choice4') {
    optionsHtml = `<div class="options-choice">`;
    activeScale.forEach((label, i) => {
      const sel = answers[cur] === i ? 'selected' : '';
      optionsHtml += `<button type="button" class="opt-choice ${sel}" onclick="selectAnswer(${i}, this)">
        <span>${label}</span>
      </button>`;
    });
    optionsHtml += `</div>`;
  } else if (s.type === 'freq5') {
    optionsHtml = `<div class="options-freq-5">`;
    activeScale.forEach((label, i) => {
      const sel = answers[cur] === s.values[i] ? 'selected' : '';
      optionsHtml += `<button type="button" class="opt ${sel}" onclick="selectAnswer(${s.values[i]}, this)">
        <span class="opt-num">${s.values[i]}</span>
        <span>${label}</span>
      </button>`;
    });
    optionsHtml += `</div>`;
  } else {
    optionsHtml = `<div class="options-yesno">`;
    activeScale.forEach((label, i) => {
      const val = s.values[i];
      const sel = answers[cur] === val ? (val === 1 && s.suicidal ? 'selected selected-yes' : 'selected') : '';
      optionsHtml += `<button type="button" class="opt-yn ${sel}" onclick="selectAnswer(${val}, this)">${label}</button>`;
    });
    optionsHtml += `</div>`;
  }

  let animClass = '';
  if (direction === 'backward') {
    animClass = 'slide-in-left';
  } else if (direction === 'forward' || direction === 'initial') {
    animClass = 'slide-in-right';
  }

  document.getElementById('main-area').innerHTML = `
    <div class="q-card ${animClass}">
      <div class="section-tag" style="background:${s.soft}; color:${s.color}; border: 1px solid ${s.color}33;">
        ${fullSectionTitle}
      </div>
      <p class="instruction-text">${activeInstruction}</p>
      <p class="q-text">${activeQuestionText}</p>
      ${optionsHtml}
    </div>
  `;
}

function selectAnswer(val, buttonElement) {
  if (isTransitioning) return;
  isTransitioning = true;

  answers[cur] = val;

  // Immediate visual feedback
  const container = buttonElement ? buttonElement.closest('.options-freq, .options-choice, .options-freq-5, .options-yesno') : null;
  if (container) {
    container.classList.add('options-disabled');
    container.querySelectorAll('.opt, .opt-choice, .opt-yn').forEach(btn => {
      btn.classList.remove('selected', 'selected-yes');
    });
    const q = allQ[cur];
    const s = SECTIONS[q.sec];
    if (val === 1 && s.suicidal) {
      buttonElement.classList.add('selected', 'selected-yes');
    } else {
      buttonElement.classList.add('selected');
    }
  }

  // Smooth slide out and auto-advance
  setTimeout(() => {
    const card = document.querySelector('.q-card');
    if (card) {
      card.classList.remove('slide-in-right', 'slide-in-left');
      card.classList.add('slide-out-left');
    }

    setTimeout(() => {
      if (cur < allQ.length - 1) {
        cur++;
        render('forward');
        isTransitioning = false;
      } else {
        finishQuestionnaire();
      }
    }, 180);
  }, 200);
}

function prev() {
  if (isTransitioning || cur === 0) return;
  isTransitioning = true;

  const card = document.querySelector('.q-card');
  if (card) {
    card.classList.remove('slide-in-right', 'slide-in-left');
    card.classList.add('slide-out-right');
  }

  setTimeout(() => {
    cur--;
    render('backward');
    isTransitioning = false;
  }, 180);
}

async function saveQuestionnaire(scores, flags) {
  const answerMap = {};
  allQ.forEach((question, index) => {
    const rawVal = answers[index];
    const s = SECTIONS[question.sec];
    let scoreVal = rawVal;
    if (s.id === 'mdq7') {
      scoreVal = rawVal >= 2 ? 1 : 0;
    }
    answerMap[String(index + 1)] = {
      question: question.textObj.en,
      question_localized: question.textObj[currentLang] || question.textObj.en,
      language: currentLang,
      value: rawVal,
      score_value: scoreVal
    };
  });

  const response = await fetch('{% url "collection:submit_questionnaire" %}', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'X-CSRFToken': getCookie('csrftoken')
    },
    body: JSON.stringify({
      answers: answerMap,
      scores,
      flags,
      language: currentLang
    })
  });

  const data = await response.json();
  if (!response.ok || !data.ok) {
    throw new Error(data.error || 'Could not save questionnaire.');
  }

  return data;
}

async function finishQuestionnaire() {
  const ui = UI_TEXT[currentLang] || UI_TEXT.en;
  document.getElementById('prog-fill').style.width = '100%';
  document.getElementById('prog-fill').style.background = 'var(--accent)';
  document.getElementById('section-name').textContent = '100%';
  document.getElementById('step-indicator').textContent = 'Complete';
  document.getElementById('nav-bar').style.display = 'none';
  document.getElementById('lang-switcher').style.display = 'none';
  const errMsg = document.getElementById('err-msg');
  if (errMsg) errMsg.style.display = 'none';

  let flags = [];
  let scores = {};

  SECTIONS.forEach((s, si) => {
    const score = getSectionScore(si);
    scores[s.id] = score;
  });

  // PHQ-9 (Q1-Q9): Score >= 10
  if (scores.phq9 >= 10) {
    flags.push('phq9');
  }

  // GAD-7 (Q10-Q16): Score >= 10
  if (scores.gad7 >= 10) {
    flags.push('gad7');
  }

  // PSS-4 (Q17-Q20): Score >= 9
  if (scores.pss4 >= 9) {
    flags.push('pss4');
  }

  // MDQ-7 (Q21-Q27): Score >= 5
  if (scores.mdq7 >= 5) {
    flags.push('mdq7');
  }

  // C-SSRS (Q28-Q30): Any positive response
  if (scores.cssrs >= 1 || answers[27] === 1 || answers[28] === 1 || answers[29] === 1) {
    flags.push('cssrs');
  }

  if (flags.length === 0) {
    flags.push('normal');
  }

  document.getElementById('main-area').innerHTML = `
    <div class="result-hero">
      <p class="result-hero-label">${ui.completeHeader}</p>
      <p class="result-primary-name">${ui.completeTitle}</p>
      <p style="font-size:13.5px;color:var(--text-secondary);margin-top:0.75rem;line-height:1.5;">${ui.completeSubtitle}</p>
    </div>
    <div class="disclaimer">
      ${ui.preparing}
    </div>
  `;

  try {
    await saveQuestionnaire(scores, flags);
    window.location.href = '{% url "collection:activity_hub" %}';
  } catch (error) {
    const notice = document.createElement('p');
    notice.className = 'disclaimer';
    notice.style.color = 'var(--section-phq)';
    notice.textContent = ui.saveError;
    document.getElementById('main-area').appendChild(notice);
  }
}

// Initial render
render('initial');
</script>
</body>
</html>
