services:
  postgres:
    image: postgres:16
    container_name: mindspace-data-collection-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mindspace_collection
      POSTGRES_USER: mindspace_user
      POSTGRES_PASSWORD: mindspace_local_password
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - mindspace_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindspace_user -d mindspace_collection"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mindspace-data-collection-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    ports:
      - "${DATA_COLLECTION_BIND_IP:-127.0.0.1}:${DATA_COLLECTION_PORT:-8000}:8000"
    volumes:
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

volumes:
  mindspace_postgres_data:
