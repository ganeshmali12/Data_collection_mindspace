# Nginx Configuration for Manovedh Data Collection Platform
upstream django_app {
    server web:8000;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Maximum file upload size (needed for participant video captures)
    client_max_body_size 250M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Static Assets
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Media Uploads (Encrypted participant video/audio captures)
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "private, no-transform";
    }

    # Main Application Proxy
    location / {
        proxy_pass http://django_app;
        proxy_http_version 1.1;
        
        # WebSocket & ASGI Upgrade support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for large video processing
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
